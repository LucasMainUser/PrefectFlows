[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "application"
version = "0.1.0"
description = "Application package"
requires-python = ">=3.10"

dependencies = [
    "requests==2.34.2",
    "beautifulsoup4>=4.12.0",
    "soupsieve>=2.0",
    "polars[excel]<=1.41.2",
    "xlsxwriter==3.2.9",
    "psycopg[binary]==3.2.3",
    "python-dotenv==1.2.2",
    "prefect==3.7.2",
    "boto3>=1.43.30",
    "pyarrow>=15.0.0",
    "deltalake>=0.17.0",
    "pdfplumber==0.11.10"
]

[tool.setuptools]
packages = ["application", "flows"]